---
# =============================================================================
# Trino - Distributed SQL Query Engine
# =============================================================================
# Playbook: 260206_trino-sql_rb_v1_0.yaml
# Purpose:  Deploy Trino as federated SQL engine with Iceberg/Delta catalogs
# Depends:  seaweedfs_default network, Nessie, SeaweedFS S3
# Deploy:   ansible-playbook 260206_trino-sql_rb_v1_0.yaml
# Access:   http://localhost:8085
# =============================================================================

- name: Deploy Trino SQL Engine
  hosts: localhost
  connection: local
  become: true

  vars:
    trino_dir: /opt/lakehouse/trino
    lakehouse_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    shared_network: "seaweedfs_default"

    # Trino configuration
    trino_image: "trinodb/trino:435"
    trino_container: "trino"
    trino_port: 8085

    # Memory tuning (WSL-friendly)
    trino_heap_size: "512M"
    trino_query_max_memory: "256MB"
    trino_query_max_memory_per_node: "128MB"

    # S3 configuration
    s3_endpoint: "http://s3:8333"
    s3_access_key: "dev"
    s3_secret_key: "dev"

    # Nessie configuration
    nessie_uri: "http://nessie:19120/api/v1"

  tasks:
    # =========================================================================
    # PRE-FLIGHT CHECKS
    # =========================================================================
    - name: Pre-flight - Verify nerdctl is available
      become: false
      ansible.builtin.command: nerdctl --version
      changed_when: false

    - name: Pre-flight - Verify shared network exists
      become: false
      ansible.builtin.command: nerdctl network inspect {{ shared_network }}
      register: net_check
      changed_when: false
      failed_when: false

    - name: Pre-flight - Fail if network missing
      ansible.builtin.fail:
        msg: "FATAL: Network '{{ shared_network }}' not found."
      when: net_check.rc != 0

    # =========================================================================
    # DIRECTORY SETUP
    # =========================================================================
    - name: Create Trino directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ lakehouse_user }}"
        mode: "0755"
      loop:
        - "{{ trino_dir }}"
        - "{{ trino_dir }}/etc"
        - "{{ trino_dir }}/catalog"
        - "{{ trino_dir }}/data"

    # =========================================================================
    # TRINO CONFIGURATION FILES
    # =========================================================================
    - name: Write Trino config.properties
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/etc/config.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          coordinator=true
          node-scheduler.include-coordinator=true
          http-server.http.port=8080
          discovery.uri=http://localhost:8080
          query.max-memory={{ trino_query_max_memory }}
          query.max-memory-per-node={{ trino_query_max_memory_per_node }}

    - name: Write Trino node.properties
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/etc/node.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          node.environment=lakehouse
          node.data-dir=/data/trino

    - name: Write Trino JVM config
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/etc/jvm.config"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          -server
          -Xmx{{ trino_heap_size }}
          -XX:InitialRAMPercentage=80
          -XX:MaxRAMPercentage=80
          -XX:+UseG1GC
          -XX:G1HeapRegionSize=32M
          -XX:+ExplicitGCInvokesConcurrent
          -XX:+HeapDumpOnOutOfMemoryError
          -XX:+ExitOnOutOfMemoryError
          -XX:-OmitStackTraceInFastThrow
          -XX:ReservedCodeCacheSize=128M
          -Djdk.attach.allowAttachSelf=true
          -Djdk.nio.maxCachedBufferSize=2000000

    - name: Write Trino log.properties
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/etc/log.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          io.trino=INFO

    # =========================================================================
    # CATALOG CONFIGURATIONS
    # =========================================================================
    - name: Write Iceberg catalog (Nessie backend)
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/catalog/iceberg.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          connector.name=iceberg
          iceberg.catalog.type=nessie
          iceberg.nessie.uri={{ nessie_uri }}
          iceberg.nessie.ref=main
          iceberg.nessie.default-warehouse-dir=s3a://lakehouse/warehouse/
          fs.native-s3.enabled=true
          s3.endpoint={{ s3_endpoint }}
          s3.path-style-access=true
          s3.region=us-east-1
          s3.aws-access-key={{ s3_access_key }}
          s3.aws-secret-key={{ s3_secret_key }}

    - name: Write TPCH catalog (for benchmarking)
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/catalog/tpch.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          connector.name=tpch

    - name: Write TPCDS catalog (for benchmarking)
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/catalog/tpcds.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          connector.name=tpcds

    - name: Write memory catalog (for temp tables)
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/catalog/memory.properties"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          connector.name=memory

    # =========================================================================
    # COMPOSE FILE
    # =========================================================================
    - name: Write Trino compose.yaml
      ansible.builtin.copy:
        dest: "{{ trino_dir }}/compose.yaml"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          version: "3.9"

          services:
            trino:
              image: {{ trino_image }}
              container_name: {{ trino_container }}
              ports:
                - "{{ trino_port }}:8080"
              volumes:
                - ./etc/config.properties:/etc/trino/config.properties:ro
                - ./etc/node.properties:/etc/trino/node.properties:ro
                - ./etc/jvm.config:/etc/trino/jvm.config:ro
                - ./etc/log.properties:/etc/trino/log.properties:ro
                - ./catalog:/etc/trino/catalog:ro
                - ./data:/data/trino
              restart: unless-stopped

          networks:
            default:
              external: true
              name: {{ shared_network }}

    # =========================================================================
    # CONTAINER DEPLOYMENT
    # =========================================================================
    - name: Check if Trino container exists
      become: false
      ansible.builtin.command: nerdctl inspect {{ trino_container }}
      register: trino_container_check
      changed_when: false
      failed_when: false

    - name: Stop existing Trino container (for idempotency)
      become: false
      ansible.builtin.command: nerdctl compose -f compose.yaml down
      args:
        chdir: "{{ trino_dir }}"
      when: trino_container_check.rc == 0
      changed_when: true
      failed_when: false

    - name: Pull Trino image
      become: false
      ansible.builtin.command: nerdctl pull {{ trino_image }}
      changed_when: false
      failed_when: false

    - name: Deploy Trino with nerdctl compose
      become: false
      ansible.builtin.command: nerdctl compose -f compose.yaml up -d
      args:
        chdir: "{{ trino_dir }}"
      register: compose_result
      changed_when: true

    # =========================================================================
    # POST-DEPLOYMENT VERIFICATION
    # =========================================================================
    - name: Wait for Trino to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ trino_port }}"
        timeout: 90
        state: started

    - name: Verify Trino UI responds
      ansible.builtin.uri:
        url: "http://localhost:{{ trino_port }}/ui/"
        method: GET
        status_code: [200, 301, 302]
        follow_redirects: safe
      register: trino_health
      retries: 10
      delay: 5
      until: trino_health.status is defined

    - name: Test Trino query execution
      become: false
      ansible.builtin.command: >
        nerdctl exec {{ trino_container }}
        trino --execute "SELECT 'trino_ok' AS status"
      register: trino_query_test
      changed_when: false
      failed_when: false
      retries: 5
      delay: 10

    - name: Show Trino deployment info
      ansible.builtin.debug:
        msg: |
          ============================================
          Trino deployed successfully!
          ============================================

          Web UI:       http://localhost:{{ trino_port }}
          JDBC URL:     jdbc:trino://localhost:{{ trino_port }}

          Catalogs:
            - iceberg  (Nessie + SeaweedFS S3)
            - tpch     (benchmark data)
            - tpcds    (benchmark data)
            - memory   (temp tables)

          Query test:
            nerdctl exec trino trino --execute \
              "SELECT * FROM tpch.tiny.nation LIMIT 5"

          Iceberg test:
            nerdctl exec trino trino --execute \
              "SHOW SCHEMAS FROM iceberg"

          Heap:              {{ trino_heap_size }}
          Max query memory:  {{ trino_query_max_memory }}

          ============================================
