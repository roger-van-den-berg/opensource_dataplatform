---
# =============================================================================
# Homer Dashboard - Central Portal for Lakehouse Platform
# =============================================================================
# Playbook: 260206_homer-dashboard_rb_v1_0.yaml
# Purpose:  Deploy Homer as a lightweight service discovery dashboard
# Depends:  seaweedfs_default network (from SeaweedFS deployment)
# Deploy:   ansible-playbook 260206_homer-dashboard_rb_v1_0.yaml
# Access:   http://localhost:8090
# =============================================================================

- name: Deploy Homer Dashboard
  hosts: localhost
  connection: local
  become: true

  vars:
    homer_dir: /opt/lakehouse/homer
    homer_port: 8090
    homer_image: "b4bz/homer:latest"
    homer_container: "homer"
    lakehouse_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    shared_network: "seaweedfs_default"

  tasks:
    # =========================================================================
    # PRE-FLIGHT CHECKS
    # =========================================================================
    - name: Pre-flight - Verify nerdctl is available
      become: false
      ansible.builtin.command: nerdctl --version
      register: nerdctl_version
      changed_when: false

    - name: Pre-flight - Show nerdctl version
      ansible.builtin.debug:
        msg: "nerdctl: {{ nerdctl_version.stdout }}"

    - name: Pre-flight - Verify shared network exists
      become: false
      ansible.builtin.command: nerdctl network inspect {{ shared_network }}
      register: net_check
      changed_when: false
      failed_when: false

    - name: Pre-flight - Fail if network missing
      ansible.builtin.fail:
        msg: >
          FATAL: Network '{{ shared_network }}' not found.
          Deploy SeaweedFS first to create the shared network.
      when: net_check.rc != 0

    # =========================================================================
    # DIRECTORY SETUP
    # =========================================================================
    - name: Create Homer directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ lakehouse_user }}"
        mode: "0755"
      loop:
        - "{{ homer_dir }}"
        - "{{ homer_dir }}/assets"
        - "{{ homer_dir }}/assets/tools"

    # =========================================================================
    # CONFIGURATION
    # =========================================================================
    - name: Write Homer dashboard configuration
      ansible.builtin.copy:
        dest: "{{ homer_dir }}/assets/config.yml"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          ---
          title: "Lakehouse Platform"
          subtitle: "Open Source Data Engineering Stack"

          header: true
          footer: false
          columns: "3"
          connectivityCheck: false

          defaults:
            layout: list
            colorTheme: dark

          theme: default
          colors:
            light:
              highlight-primary: "#3367d6"
              highlight-secondary: "#4285f4"
              highlight-hover: "#5a95f5"
              background: "#f5f5f5"
              card-background: "#ffffff"
              text: "#363636"
              text-header: "#ffffff"
              text-title: "#303030"
              text-subtitle: "#424242"
              card-shadow: rgba(0, 0, 0, 0.1)
            dark:
              highlight-primary: "#3367d6"
              highlight-secondary: "#4285f4"
              highlight-hover: "#5a95f5"
              background: "#131313"
              card-background: "#2b2b2b"
              text: "#eaeaea"
              text-header: "#ffffff"
              text-title: "#fafafa"
              text-subtitle: "#f5f5f5"
              card-shadow: rgba(0, 0, 0, 0.4)

          links: []

          services:
            - name: "Storage Layer"
              icon: "fas fa-database"
              items:
                - name: "SeaweedFS Master"
                  subtitle: "Distributed Object Storage - Master Node"
                  tag: "storage"
                  url: "http://localhost:9333"
                  target: "_blank"
                  type: Ping
                  method: head

                - name: "SeaweedFS S3 API"
                  subtitle: "S3-Compatible API Gateway"
                  tag: "storage"
                  url: "http://localhost:8333"
                  target: "_blank"

                - name: "SeaweedFS Filer"
                  subtitle: "POSIX-like File Interface"
                  tag: "storage"
                  url: "http://localhost:8888"
                  target: "_blank"

            - name: "Query Engines"
              icon: "fas fa-search"
              items:
                - name: "Databend"
                  subtitle: "Cloud Data Warehouse"
                  tag: "query"
                  url: "http://localhost:28080"
                  target: "_blank"

                - name: "Trino"
                  subtitle: "Distributed SQL Query Engine"
                  tag: "query"
                  url: "http://localhost:8085"
                  target: "_blank"

            - name: "Processing & Catalog"
              icon: "fas fa-cogs"
              items:
                - name: "Spark Master"
                  subtitle: "Distributed Processing Engine"
                  tag: "processing"
                  url: "http://localhost:8081"
                  target: "_blank"

                - name: "Spark History Server"
                  subtitle: "Completed Job History"
                  tag: "processing"
                  url: "http://localhost:18080"
                  target: "_blank"

                - name: "Nessie Catalog"
                  subtitle: "Git-like Data Versioning"
                  tag: "catalog"
                  url: "http://localhost:19120/api/v1/trees"
                  target: "_blank"

            - name: "Data Science"
              icon: "fas fa-flask"
              items:
                - name: "JupyterLab"
                  subtitle: "Interactive Notebooks (token: lakehouse)"
                  tag: "datascience"
                  url: "http://localhost:8889"
                  target: "_blank"

            - name: "Orchestration & Visualization"
              icon: "fas fa-chart-line"
              items:
                - name: "Airflow"
                  subtitle: "Workflow Orchestration (admin/admin)"
                  tag: "orchestration"
                  url: "http://localhost:8086"
                  target: "_blank"

                - name: "Superset"
                  subtitle: "Business Intelligence (admin/admin)"
                  tag: "visualization"
                  url: "http://localhost:8088"
                  target: "_blank"

            - name: "Shared Services"
              icon: "fas fa-heartbeat"
              items:
                - name: "PostgreSQL"
                  subtitle: "Relational Database (port 5432)"
                  tag: "infra"
                  url: "#"

                - name: "Redis"
                  subtitle: "In-Memory Cache (port 6379)"
                  tag: "infra"
                  url: "#"

    # =========================================================================
    # COMPOSE FILE
    # =========================================================================
    - name: Write Homer compose.yaml
      ansible.builtin.copy:
        dest: "{{ homer_dir }}/compose.yaml"
        owner: "{{ lakehouse_user }}"
        mode: "0644"
        content: |
          version: "3.9"

          services:
            homer:
              image: {{ homer_image }}
              container_name: {{ homer_container }}
              ports:
                - "{{ homer_port }}:8080"
              volumes:
                - ./assets:/www/assets
              restart: unless-stopped

          networks:
            default:
              external: true
              name: {{ shared_network }}

    # =========================================================================
    # CONTAINER DEPLOYMENT
    # =========================================================================
    - name: Check if Homer container exists
      become: false
      ansible.builtin.command: nerdctl inspect {{ homer_container }}
      register: container_check
      changed_when: false
      failed_when: false

    - name: Stop existing Homer container (for idempotency)
      become: false
      ansible.builtin.command: nerdctl rm -f {{ homer_container }}
      when: container_check.rc == 0
      changed_when: true

    - name: Pull Homer image
      become: false
      ansible.builtin.command: nerdctl pull {{ homer_image }}
      register: pull_result
      changed_when: "'Pull complete' in pull_result.stdout or 'Downloaded' in pull_result.stdout"
      failed_when: false

    - name: Deploy Homer with nerdctl compose
      become: false
      ansible.builtin.command: nerdctl compose -f compose.yaml up -d
      args:
        chdir: "{{ homer_dir }}"
      register: compose_result
      changed_when: true

    # =========================================================================
    # POST-DEPLOYMENT VERIFICATION
    # =========================================================================
    - name: Wait for Homer to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ homer_port }}"
        timeout: 30
        state: started

    - name: Verify Homer HTTP response
      ansible.builtin.uri:
        url: "http://localhost:{{ homer_port }}"
        method: GET
        status_code: [200, 301, 302]
      register: homer_health
      retries: 3
      delay: 5
      until: homer_health.status in [200, 301, 302]

    - name: Show Homer deployment info
      ansible.builtin.debug:
        msg: |
          ============================================
          Homer Dashboard deployed successfully!
          ============================================

          Portal URL: http://localhost:{{ homer_port }}

          This is your central hub for accessing all
          lakehouse platform services.

          Config: {{ homer_dir }}/assets/config.yml
          ============================================
